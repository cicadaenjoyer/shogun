name: Shogun Server Tests
on:
    push:
        branches: [main]
    pull_request:
jobs:
    Shogun-Server-Tests:
        runs-on: "ubuntu-latest"
        defaults:
            run:
                working-directory: backend
        steps:
            - name: Check out repository code
              uses: actions/checkout@v7
            - run: echo "Running Shogun Server Tests"
            - run: echo "The ${{ github.repository }} repository has been cloned to the runner."
            - name: Set up .NET
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: "10.0.x"
            - name: Restore packages
              run: dotnet restore
            - name: Build
              run: dotnet build --no-restore
            - name: Lint
              run: dotnet format --verify-no-changes
            - name: Check for missing migrations
              env:
                  Storage__DataFolder: ${{ runner.temp }}/shogun/data
                  Storage__ImageCacheFolder: ${{ runner.temp }}/shogun/images
                  Storage__TranscodeTempFolder: ${{ runner.temp }}/shogun/transcode
              run: |
                  dotnet tool restore
                  dotnet ef migrations has-pending-model-changes --project Shogun.Server --no-build
            - name: Run tests
              run: dotnet test --no-build
